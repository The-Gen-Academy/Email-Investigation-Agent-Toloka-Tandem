[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "email-investigation-agent"
version = "0.3.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "streamlit>=1.57,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "mcp>=1.30,<2",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
